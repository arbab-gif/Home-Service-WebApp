<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
/* Layout: cover banner with actions; then two tabs: Items (linked directly to the space) and Sub-spaces (cards; the selected one lists its items below). */
.hero{position:relative;border-radius:12px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;background:#1A3D69 center/cover no-repeat;color:#fff;margin-bottom:22px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,26,46,.88) 0%,rgba(12,26,46,.45) 50%,rgba(12,26,46,.1) 100%),linear-gradient(90deg,rgba(12,26,46,.55),rgba(12,26,46,0) 70%)}
.hero.empty{background:var(--hover);color:var(--ink);border:1.5px dashed var(--line-2)}
.hero.empty::after{background:url(assets/logo-mark.png) right 40px center/auto 70% no-repeat;opacity:.1}
.hero-in{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;width:100%;padding:22px 24px}
.hero h1{margin:0 0 6px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.hero:not(.empty) h1,.hero:not(.empty) .meta{text-shadow:0 1px 8px rgba(8,20,38,.5)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;opacity:.92}
.hero .meta span{display:inline-flex;align-items:center;gap:6px}
.hero:not(.empty) .meta svg.i{color:#fff}
.hero-act{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:#fff;background:rgba(12,26,46,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.gbtn:hover{background:rgba(12,26,46,.8)}
.gbtn svg.i{color:#fff;width:17px;height:17px}
.gbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero.empty .gbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.hero.empty .gbtn svg.i{color:var(--ink-2)}
.hero.empty .gbtn.danger{color:var(--red)}
.hero.empty .gbtn.danger svg.i{color:var(--red)}

.subs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:4px 20px 20px}
/* Tabs */
.tabbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tabbar .seg button{height:34px;padding:0 16px;font-size:14px}
#panel{display:grid;gap:16px}
.panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px 14px}
.panel-h h2{margin:0;font-size:15px;font-weight:600}
.panel-h p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.panel-h .search{flex:0 1 280px}
/* Selected sub-space items */
.sub-items{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sub{position:relative;display:grid;gap:8px;min-width:0;text-align:left;border-radius:10px}
.sub-btn{display:grid;gap:8px;text-align:left;border-radius:10px;min-width:0}
.sub .thumb{transition:box-shadow .15s,border-color .15s}
.sub-btn:hover .thumb{box-shadow:0 6px 18px rgba(20,32,46,.12)}
.sub-btn:hover .thumb img{transform:scale(1.04)}
.sub.on .thumb{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.sub.on b{color:var(--brand)}
.sub.on small{color:var(--brand);opacity:.8}
.sub b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sub small{font-size:12.5px;color:var(--ink-3)}
.sub>.kebab{position:absolute;top:8px;right:8px}
.sub:hover>.kebab{opacity:1}

.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) 32px;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--hover)}
.pic{width:52px;height:52px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--hover);border:1px solid var(--line);flex:none}
.pic img{width:100%;height:100%;object-fit:cover}
.pic.add{position:relative;border:1.5px dashed var(--line-2)}
.pic.add::before{content:"";position:absolute;inset:0;background:url(assets/logo-mark.png) center/auto 62% no-repeat;opacity:.13}
.pic.add svg.i{position:relative;width:18px;height:18px;color:var(--brand)}
.pic.add:hover{border-color:var(--brand);background:var(--brand-tint)}
.photo-pick .pv.sq{width:72px;aspect-ratio:1}
.it-link{color:inherit;display:block;min-width:0}
.it-link:hover b{color:var(--brand);text-decoration:underline}
.it b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.items-foot{padding:10px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}

.missing{max-width:440px;margin:60px auto;text-align:center}
.missing h1{font-size:22px;margin:0 0 6px}
.missing p{color:var(--ink-3);margin:0 0 16px}

@media (max-width:720px){
  .hero{min-height:200px}.hero-in{padding:18px 16px}.hero h1{font-size:24px}
  .subs-grid{padding:4px 16px 16px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .item{grid-template-columns:52px minmax(0,1fr) 32px;padding:11px 16px}
  .panel-h{padding:14px 16px 12px}
  .panel-h .search{flex:1 1 100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="home-dashboard.html"><img src="assets/logo-mark.png" alt="" width="150" height="130"><span>Home Record Keeper</span></a>
    <nav class="nav" aria-label="Main">
      <a href="home-dashboard.html">Overview</a>
      <a href="spaces.html" aria-current="page">Spaces</a>
      <a href="items.html">Items</a>
      <a href="documents.html">Documents</a>
      <a href="checklists.html">Checklists<span class="nav-n">4</span></a>
      <a href="activity.html">Activity</a>
      <a href="access.html">Property access</a>
    </nav>
    <div class="top-r">
      <button class="bell" aria-label="Notifications (12 unread)"><svg class="i"><use href="#i-bell"/></svg><i></i></button>
      <span class="av" role="img" aria-label="Brady Ricci"></span>
    </div>
  </div>
</header>

<main class="page" id="page"></main>

<script src="assets/hrk.js"></script>
<script>
(function(){
  const {store, ico, esc, plural, thumb, menu, dialog, spaceDialog, deleteSpaceDialog, readPhoto, pickPhoto, toast, flashNext, CATS} = HRK;
  const $ = s => document.querySelector(s);
  /* Hash: #space or #space--subspace (opens the Sub-spaces tab with that sub-space active) */
  const parseHash = () => { const [sp, sub] = decodeURIComponent(location.hash.slice(1)).split('--'); return {sp: sp || 'kitchen', sub: sub || ''}; };
  let id = parseHash().sp;
  let tab = parseHash().sub ? 'subs' : 'items', activeSub = parseHash().sub, q = '';

  const kebabBtn = (attr, label) => `<button type="button" class="ib" ${attr} aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${esc(label)}">${ico('more')}</button>`;
  function itemRows(list){
    return list.map(i => `
      <li class="item">
        ${i.photo ? `<span class="pic"><img src="${esc(i.photo)}" alt="" loading="lazy"></span>` : `<button type="button" class="pic add" data-itemphoto="${i.id}" aria-label="Add a photo of ${esc(i.name)}">${ico('plus')}</button>`}
        <span class="it"><a class="it-link" href="item.html#${i.id}"><b>${esc(i.name)}</b></a><span>${esc(i.model || CATS[i.cat] || '')}</span></span>
        ${kebabBtn(`data-itemmenu="${i.id}"`, i.name)}
      </li>`).join('');
  }

  function render(){
    const s = store.get(id);
    if (!s){
      document.title = 'Space not found';
      $('#page').innerHTML = `<div class="missing"><h1>This space isn't here</h1><p>It may have been deleted or renamed.</p><a class="btn primary" href="spaces.html">${ico('left')}Back to spaces</a></div>`;
      return;
    }
    if (activeSub && !s.subs.some(x => x.id === activeSub)) activeSub = '';
    document.title = `${s.name} · Spaces`;
    const fl = store.floor(s.floor);
    const direct = s.items.filter(i => !i.sub);
    $('#page').innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="home-dashboard.html">Vail Residence</a>${ico('right')}<a href="spaces.html">Spaces</a>${ico('right')}<a href="spaces.html#${fl.id}">${fl.name}</a>${ico('right')}<span aria-current="page">${esc(s.name)}</span>
      </nav>
      <section class="hero ${s.photo ? '' : 'empty'}" style="${s.photo ? `background-image:url('${esc(s.photo)}');background-position:${s.pos || '50% 50%'}` : ''}">
        <div class="hero-in">
          <div>
            <h1>${esc(s.name)}</h1>
            <div class="meta">
              <span>${ico('layers')}${fl.name}</span>
              <span>${ico('sub')}${plural(s.subs.length, 'sub-space')}</span>
              <span>${ico('box')}${plural(s.items.length, 'item')}</span>
            </div>
          </div>
          <div class="hero-act">
            ${s.photo ? '' : `<button type="button" class="gbtn" id="heroPhoto">${ico('upload')}Add cover photo</button>`}
            <button type="button" class="gbtn" id="editSpace">${ico('edit')}Edit space</button>
            <button type="button" class="gbtn danger" id="delSpace">${ico('trash')}Delete</button>
          </div>
        </div>
      </section>

      <div class="tabbar">
        <div class="seg" role="tablist" id="tabs" aria-label="Space contents">
          <button role="tab" type="button" id="tab-items" aria-controls="panel" data-tab="items" aria-selected="${tab === 'items'}">Items<span class="n">${direct.length}</span></button>
          <button role="tab" type="button" id="tab-subs" aria-controls="panel" data-tab="subs" aria-selected="${tab === 'subs'}">Sub-spaces<span class="n">${s.subs.length}</span></button>
        </div>
        ${tab === 'items'
          ? `<button type="button" class="btn primary" id="addItem">${ico('plus')}Add item</button>`
          : `<button type="button" class="btn green" id="addSub">${ico('plus')}Add sub-space</button>`}
      </div>

      <div id="panel" role="tabpanel" aria-labelledby="tab-${tab}">${tab === 'items' ? itemsPanel(s, direct) : subsPanel(s)}</div>`;
    wire(s);
  }

  /* Items tab: only items linked directly to the space */
  function itemsPanel(s, direct){
    const ql = q.toLowerCase();
    const list = direct.filter(i => !ql || i.name.toLowerCase().includes(ql) || (i.model || '').toLowerCase().includes(ql));
    return `<section class="card" aria-label="Items in ${esc(s.name)}">
      <div class="panel-h">
        <div><h2>Items in ${esc(s.name)}</h2><p>Linked directly to this space. Items inside a sub-space are under Sub-spaces.</p></div>
        ${direct.length ? `<label class="search">${ico('search')}<input id="iq" type="search" placeholder="Search items" aria-label="Search items" value="${esc(q)}"></label>` : ''}
      </div>
      <ul class="items" id="items">${list.length ? itemRows(list)
        : `<li class="empty-state">${direct.length ? '<b>No items match</b>Try a different search.' : `<b>No items linked directly to ${esc(s.name)}</b>Add one here, or open Sub-spaces to see items in each area.`}</li>`}</ul>
      ${direct.length ? `<div class="items-foot">${ql ? `Showing ${list.length} of ${plural(direct.length, 'item')}` : plural(direct.length, 'item')}</div>` : ''}
    </section>`;
  }

  /* Sub-spaces tab: cards; the active one shows its items underneath (first one is active by default) */
  function subsPanel(s){
    if (!s.subs.length) return `<section class="card"><div class="empty-state"><b>No sub-spaces yet</b>Split ${esc(s.name.toLowerCase())} into areas like a pantry or closet to find items faster.</div></section>`;
    if (!s.subs.some(x => x.id === activeSub)) activeSub = s.subs[0].id;
    const sel = s.subs.find(x => x.id === activeSub);
    const subItems = s.items.filter(i => i.sub === sel.id);
    return `<section class="card" aria-label="Sub-spaces in ${esc(s.name)}">
        <div class="panel-h"><h2>Sub-spaces in ${esc(s.name)}</h2></div>
        <div class="subs-grid" id="subs">${s.subs.map(x => subCard(s, x)).join('')}</div>
      </section>
      <section class="card sub-items" id="subItems" aria-labelledby="h-subitems">
        <div class="panel-h"><div><h2 id="h-subitems">Items in ${esc(sel.name)}</h2><p>${plural(subItems.length, 'item')}</p></div></div>
        <ul class="items">${subItems.length ? itemRows(subItems) : `<li class="empty-state"><b>No items in ${esc(sel.name)} yet</b></li>`}</ul>
      </section>`;
  }
  function subCard(s, x){
    const n = s.items.filter(i => i.sub === x.id).length, on = activeSub === x.id;
    const kebab = `<button type="button" class="kebab" aria-haspopup="menu" aria-expanded="false" data-submenu="${x.id}" aria-label="Actions for ${esc(x.name)}">${ico('more')}</button>`;
    const tick = '';
    return `<div class="sub ${on ? 'on' : ''}">
      ${x.photo
        ? `<button type="button" class="sub-btn" data-sub="${x.id}" aria-pressed="${on}"><span class="thumb"><img src="${esc(x.photo)}" alt="" loading="lazy" style="object-position:${x.pos || '50% 50%'}">${tick}</span>
           <span><b>${esc(x.name)}</b><small>${plural(n, 'item')}</small></span></button>`
        : `<span class="thumb empty"><button type="button" class="add-ph" data-subphoto="${x.id}" aria-label="Add a photo of ${esc(x.name)}"><span class="plus">${ico('plus')}</span><span>Add photo</span></button>${tick}</span>
           <button type="button" class="sub-btn" data-sub="${x.id}" aria-pressed="${on}"><span><b>${esc(x.name)}</b><small>${plural(n, 'item')}</small></span></button>`}
      ${kebab}
    </div>`;
  }

  function subDialog(s, x){
    dialog({
      title: x ? `Rename ${esc(x.name)}` : `Add sub-space to ${esc(s.name)}`, ok: x ? 'Save' : 'Add sub-space', size:'sm',
      body: `<div class="field"><label for="subName">Sub-space name<span class="req">*</span></label>
        <div class="ctl"><input id="subName" maxlength="40" value="${x ? esc(x.name) : ''}" placeholder="e.g. Pantry"></div>
        <span class="msg" hidden>Enter a name.</span></div>`,
      onOk(bg){
        const v = bg.querySelector('#subName').value.trim(), f = bg.querySelector('.field');
        f.classList.toggle('err', !v); f.querySelector('.msg').hidden = !!v;
        if (!v) return false;
        if (x){ store.updateSub(s.id, x.id, {name:v}); toast('Sub-space renamed'); }
        else { activeSub = store.addSub(s.id, {name:v}); tab = 'subs'; toast(`${v} added`); }
        render();
      }
    });
  }

  /* Item menu: options are shown for the design; actions are not wired up */
  function itemMenu(s, k){
    menu(k, [
      {icon:'edit', label:'Edit item', run: () => {}},
      '-',
      {icon:'trash', label:'Delete item', danger:true, run: () => {}}
    ]);
  }
  function wire(s){
    $('#editSpace').onclick = () => spaceDialog({space:s, onSaved: render});
    $('#delSpace').onclick = () => deleteSpaceDialog(s, () => { flashNext(`${s.name} deleted`); location.href = 'spaces.html'; });
    const hp = $('#heroPhoto');
    if (hp) hp.onclick = async () => { const f = await pickPhoto(); if (!f) return; try { store.updateSpace(s.id, {photo: await readPhoto(f)}); render(); toast('Cover photo added'); } catch(err){ toast(err.message); } };
    $('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b || b.dataset.tab === tab) return; tab = b.dataset.tab; render(); $('#tab-' + tab).focus(); };
    $('#tabs').onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); tab = tab === 'items' ? 'subs' : 'items'; render(); $('#tab-' + tab).focus(); } };
    const ai = $('#addItem'); if (ai) ai.onclick = () => HRK.addItemDialog({space:s.id, onAdded(sp, sub){
      if (sp !== s.id){ location.href = 'space.html#' + sp + (sub ? '--' + sub : ''); return; }
      if (sub){ tab = 'subs'; activeSub = sub; } else tab = 'items';
      render();
    }});
    const as = $('#addSub'); if (as) as.onclick = () => subDialog(s);
    const iq = $('#iq'); if (iq) iq.addEventListener('input', e => {
      q = e.target.value; const pos = e.target.selectionStart; render();
      const n = $('#iq'); n.focus(); n.setSelectionRange(pos, pos);
    });
    $('#panel').addEventListener('click', async e => {
      const im = e.target.closest('[data-itemmenu]'); if (im) return itemMenu(s, im);
      const ip = e.target.closest('[data-itemphoto]');
      if (ip){ const f = await pickPhoto(); if (!f) return; try { const it = s.items.find(i => i.id === ip.dataset.itemphoto); store.updateItem(s.id, it.id, {photo: await readPhoto(f, 600)}); render(); toast(`Photo added to ${it.name}`); } catch(err){ toast(err.message); } return; }
      const k = e.target.closest('[data-submenu]');
      if (k){
        e.stopPropagation();
        const x = s.subs.find(y => y.id === k.dataset.submenu);
        return menu(k, [
          {icon:'edit', label:'Rename', run: () => subDialog(s, x)},
          {icon:'upload', label: x.photo ? 'Replace photo' : 'Add photo', run: async () => { const f = await pickPhoto(); if (!f) return; try { store.updateSub(s.id, x.id, {photo: await readPhoto(f), pos:''}); render(); toast(`Photo added to ${x.name}`); } catch(err){ toast(err.message); } }},
          '-',
          {icon:'trash', label:'Delete sub-space', danger:true, run: () => {
            const n = s.items.filter(i => i.sub === x.id).length;
            dialog({title:`Delete ${esc(x.name)}?`, ok:'Delete sub-space', danger:true, size:'sm',
              body:`<p><b>${esc(x.name)}</b> will be removed from ${esc(s.name)}.${n ? ` Its ${plural(n, 'item')} move to the Items tab of ${esc(s.name)}.` : ''}</p>`,
              onOk(){ store.deleteSub(s.id, x.id); if (activeSub === x.id) activeSub = ''; render(); toast(`${x.name} deleted`); }});
          }}
        ]);
      }
      const ph = e.target.closest('[data-subphoto]');
      if (ph){
        const f = await pickPhoto(); if (!f) return;
        try { store.updateSub(s.id, ph.dataset.subphoto, {photo: await readPhoto(f), pos:''}); render(); toast('Photo added'); } catch(err){ toast(err.message); }
        return;
      }
      const b = e.target.closest('[data-sub]');
      if (b){
        activeSub = b.dataset.sub; render();
        const si = $('#subItems'); if (si) si.scrollIntoView({behavior:'smooth', block:'nearest'});
      }
    });
  }

  window.addEventListener('hashchange', () => { const h = parseHash(); id = h.sp; tab = h.sub ? 'subs' : 'items'; activeSub = h.sub; q = ''; render(); scrollTo(0, 0); });
  render();})();
</script>
</body>
</html>

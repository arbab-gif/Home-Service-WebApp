<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
/* Layout: cover banner with actions; then Subspaces (photo cards) and Items (list filtered by subspace). */
.hero{position:relative;border-radius:12px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;background:#1A3D69 center/cover no-repeat;color:#fff;margin-bottom:22px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,26,46,.88) 0%,rgba(12,26,46,.45) 50%,rgba(12,26,46,.1) 100%),linear-gradient(90deg,rgba(12,26,46,.55),rgba(12,26,46,0) 70%)}
.hero.empty{background:var(--hover);color:var(--ink);border:1.5px dashed var(--line-2)}
.hero.empty::after{background:url(assets/logo-mark.png) right 40px center/auto 70% no-repeat;opacity:.1}
.hero-in{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;width:100%;padding:22px 24px}
.hero h1{margin:0 0 6px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.hero:not(.empty) h1,.hero:not(.empty) .meta{text-shadow:0 1px 8px rgba(8,20,38,.5)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;opacity:.92}
.hero .meta span{display:inline-flex;align-items:center;gap:6px}
.hero:not(.empty) .meta svg.i{color:#fff}
.hero-act{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:#fff;background:rgba(12,26,46,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.gbtn:hover{background:rgba(12,26,46,.8)}
.gbtn svg.i{color:#fff;width:17px;height:17px}
.gbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero.empty .gbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.hero.empty .gbtn svg.i{color:var(--ink-2)}
.hero.empty .gbtn.danger{color:var(--red)}
.hero.empty .gbtn.danger svg.i{color:var(--red)}

.sec{margin-bottom:22px}
.subs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:4px 20px 20px}
.sub{position:relative;display:grid;gap:8px;min-width:0;text-align:left;border-radius:10px}
.sub-btn{display:grid;gap:8px;text-align:left;border-radius:10px;min-width:0}
.sub .thumb{transition:box-shadow .15s,border-color .15s}
.sub-btn:hover .thumb{box-shadow:0 6px 18px rgba(20,32,46,.12)}
.sub-btn:hover .thumb img{transform:scale(1.04)}
.sub.on .thumb{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.sub b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sub small{font-size:12.5px;color:var(--ink-3)}
.sub>.kebab{position:absolute;top:8px;right:8px}
.sub:hover>.kebab{opacity:1}
.sub .sel-tick{position:absolute;bottom:8px;left:8px;z-index:2;display:none;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--brand);color:#fff}
.sub.on .sel-tick{display:inline-flex}
.sub .sel-tick svg.i{color:#fff;width:12px;height:12px}
.add-sub{display:grid;place-items:center;aspect-ratio:16/10;border:1.5px dashed var(--line-2);border-radius:9px;color:var(--brand);font-weight:600;font-size:13px}
.add-sub:hover{background:var(--brand-tint);border-color:var(--brand)}
.add-sub span{display:grid;justify-items:center;gap:6px}
.add-sub svg.i{color:var(--brand);width:20px;height:20px}
.none{padding:4px 20px 20px;color:var(--ink-3);font-size:13.5px}

.items-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.items-tools .search{flex:1 1 220px;max-width:340px}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:16px;background:var(--brand-tint);color:var(--brand);font-weight:600;font-size:13px}
.filter-chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.filter-chip button:hover{background:rgba(36,81,138,.15)}
.filter-chip svg.i{color:var(--brand);width:14px;height:14px}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto 32px;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--hover)}
.cat{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--seg-track)}
.cat svg.i{width:19px;height:19px;color:var(--ink-2)}
.it b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.where{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:12px;background:var(--seg-track);color:var(--ink-2);white-space:nowrap}
.where svg.i{width:13px;height:13px}
.it-docs{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;min-width:64px}
.it-docs svg.i{width:14px;height:14px}
.wty{color:var(--green);font-weight:500}
.wty.soon{color:var(--amber)}
.items-foot{padding:10px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}

.missing{max-width:440px;margin:60px auto;text-align:center}
.missing h1{font-size:22px;margin:0 0 6px}
.missing p{color:var(--ink-3);margin:0 0 16px}

@media (max-width:720px){
  .hero{min-height:200px}.hero-in{padding:18px 16px}.hero h1{font-size:24px}
  .subs-grid{padding:4px 16px 16px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .items-tools{padding:0 16px 12px}
  .item{grid-template-columns:40px minmax(0,1fr) 32px;padding:11px 16px}
  .item .where,.item .it-docs{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="home-dashboard.html"><img src="assets/logo-mark.png" alt="" width="150" height="130"><span>Home Record Keeper</span></a>
    <nav class="nav" aria-label="Main">
      <a href="home-dashboard.html">Overview</a>
      <a href="spaces.html" aria-current="page">Spaces</a>
      <a href="home-dashboard.html#documents">Documents</a>
      <a href="home-dashboard.html#checklists">Checklists<span class="nav-n">4</span></a>
      <a href="home-dashboard.html#activity">Recent activity</a>
      <a href="home-dashboard.html#access">Property access</a>
    </nav>
    <div class="top-r">
      <button class="bell" aria-label="Notifications (12 unread)"><svg class="i"><use href="#i-bell"/></svg><i></i></button>
      <span class="av" role="img" aria-label="Brady Ricci"></span>
    </div>
  </div>
</header>

<main class="page" id="page"></main>

<script src="assets/hrk.js"></script>
<script>
(function(){
  const {store, ico, esc, plural, thumb, menu, dialog, spaceDialog, deleteSpaceDialog, readPhoto, pickPhoto, toast, flashNext, CATS} = HRK;
  const $ = s => document.querySelector(s);
  let id = decodeURIComponent(location.hash.slice(1)) || 'kitchen';
  let activeSub = '', q = '';

  function render(){
    const s = store.get(id);
    if (!s){
      document.title = 'Space not found';
      $('#page').innerHTML = `<div class="missing"><h1>This space isn't here</h1><p>It may have been deleted or renamed.</p><a class="btn primary" href="spaces.html">${ico('left')}Back to spaces</a></div>`;
      return;
    }
    document.title = `${s.name} · Spaces`;
    const fl = store.floor(s.floor), docs = store.docs(s);
    $('#page').innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="home-dashboard.html">Vail Residence</a>${ico('right')}<a href="spaces.html">Spaces</a>${ico('right')}<a href="spaces.html#${fl.id}">${fl.name}</a>${ico('right')}<span aria-current="page">${esc(s.name)}</span>
      </nav>
      <section class="hero ${s.photo ? '' : 'empty'}" style="${s.photo ? `background-image:url('${esc(s.photo)}');background-position:${s.pos || '50% 50%'}` : ''}">
        <div class="hero-in">
          <div>
            <h1>${esc(s.name)}</h1>
            <div class="meta">
              <span>${ico('layers')}${fl.name}</span>
              <span>${ico('sub')}${plural(s.subs.length, 'subspace')}</span>
              <span>${ico('box')}${plural(s.items.length, 'item')}</span>
              <span>${ico('file')}${plural(docs, 'document')}</span>
            </div>
          </div>
          <div class="hero-act">
            ${s.photo ? '' : `<button type="button" class="gbtn" id="heroPhoto">${ico('upload')}Add cover photo</button>`}
            <button type="button" class="gbtn" id="editSpace">${ico('edit')}Edit space</button>
            <button type="button" class="gbtn danger" id="delSpace">${ico('trash')}Delete</button>
          </div>
        </div>
      </section>

      <section class="card sec" aria-labelledby="h-subs">
        <div class="card-h"><h2 id="h-subs">Subspaces <span>${s.subs.length}</span></h2>
          <button type="button" class="btn green" id="addSub">${ico('plus')}Add subspace</button></div>
        ${s.subs.length ? `<div class="subs-grid" id="subs">${s.subs.map(x => subCard(s, x)).join('')}</div>`
          : `<p class="none">No subspaces yet. Split ${esc(s.name.toLowerCase())} into areas like a pantry or closet to find items faster.</p>`}
      </section>

      <section class="card sec" aria-labelledby="h-items">
        <div class="card-h"><h2 id="h-items">Items <span id="itemCount"></span></h2>
          <button type="button" class="btn primary" id="addItem">${ico('plus')}Add item</button></div>
        <div class="items-tools">
          <label class="search">${ico('search')}<input id="iq" type="search" placeholder="Search items" aria-label="Search items" value="${esc(q)}"></label>
          <span id="chip"></span>
        </div>
        <ul class="items" id="items"></ul>
        <div class="items-foot" id="itemsFoot"></div>
      </section>`;
    drawItems();
    wire(s);
  }

  function subCard(s, x){
    const n = s.items.filter(i => i.sub === x.id).length, on = activeSub === x.id;
    const kebab = `<button type="button" class="kebab" aria-haspopup="menu" aria-expanded="false" data-submenu="${x.id}" aria-label="Actions for ${esc(x.name)}">${ico('more')}</button>`;
    const tick = `<span class="sel-tick">${ico('check')}Showing</span>`;
    return `<div class="sub ${on ? 'on' : ''}">
      ${x.photo
        ? `<button type="button" class="sub-btn" data-sub="${x.id}" aria-pressed="${on}"><span class="thumb"><img src="${esc(x.photo)}" alt="" loading="lazy" style="object-position:${x.pos || '50% 50%'}">${tick}</span>
           <span><b>${esc(x.name)}</b><small>${plural(n, 'item')}</small></span></button>`
        : `<span class="thumb empty"><button type="button" class="add-ph" data-subphoto="${x.id}" aria-label="Add a photo of ${esc(x.name)}"><span class="plus">${ico('plus')}</span><span>Add photo</span></button>${tick}</span>
           <button type="button" class="sub-btn" data-sub="${x.id}" aria-pressed="${on}"><span><b>${esc(x.name)}</b><small>${plural(n, 'item')}</small></span></button>`}
      ${kebab}
    </div>`;
  }

  function drawItems(){
    const s = store.get(id), ql = q.toLowerCase();
    const list = s.items.filter(i => (!activeSub || i.sub === activeSub) && (!ql || i.name.toLowerCase().includes(ql) || (i.model || '').toLowerCase().includes(ql)));
    const subName = sid => (s.subs.find(x => x.id === sid) || {}).name;
    $('#itemCount').textContent = s.items.length;
    $('#chip').innerHTML = activeSub ? `<span class="filter-chip">In ${esc(subName(activeSub))}<button type="button" id="clearSub" aria-label="Show all items">${ico('x')}</button></span>` : '';
    $('#items').innerHTML = list.length ? list.map(i => `
      <li class="item">
        <span class="cat" title="${CATS[i.cat] || 'Item'}"><svg class="i" aria-hidden="true"><use href="#c-${i.cat || 'appliance'}"/></svg></span>
        <span class="it"><b>${esc(i.name)}</b><span>${esc(i.model || CATS[i.cat] || '')}${i.warranty ? ` · <span class="wty ${/ends/i.test(i.warranty) ? 'soon' : ''}">Warranty ${esc(i.warranty.replace(/^Through/,'through').replace(/^Ends/,'ends'))}</span>` : ''}</span></span>
        <span class="where">${i.sub ? ico('sub') + esc(subName(i.sub)) : ico('layers') + 'Whole ' + esc(s.name.toLowerCase())}</span>
        <span class="it-docs">${ico('file')}${plural(i.docs || 0, 'doc')}</span>
        <button type="button" class="ib" data-itemmenu="${i.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${esc(i.name)}">${ico('more')}</button>
      </li>`).join('')
      : `<li class="empty-state">${s.items.length ? `<b>No items match</b>${activeSub ? 'Nothing has been added to this subspace yet.' : 'Try a different search.'}` : `<b>No items yet</b>Add the appliances, fixtures and systems in this space.`}</li>`;
    $('#itemsFoot').textContent = activeSub || ql ? `Showing ${list.length} of ${plural(s.items.length, 'item')}` : `${plural(s.items.length, 'item')} · ${plural(store.docs(s), 'document')}`;
  }

  function subDialog(s, x){
    dialog({
      title: x ? `Rename ${esc(x.name)}` : `Add subspace to ${esc(s.name)}`, ok: x ? 'Save' : 'Add subspace', size:'sm',
      body: `<div class="field"><label for="subName">Subspace name<span class="req">*</span></label>
        <div class="ctl"><input id="subName" maxlength="40" value="${x ? esc(x.name) : ''}" placeholder="e.g. Pantry"></div>
        <span class="msg" hidden>Enter a name.</span></div>`,
      onOk(bg){
        const v = bg.querySelector('#subName').value.trim(), f = bg.querySelector('.field');
        f.classList.toggle('err', !v); f.querySelector('.msg').hidden = !!v;
        if (!v) return false;
        if (x){ store.updateSub(s.id, x.id, {name:v}); toast('Subspace renamed'); }
        else { store.addSub(s.id, {name:v}); toast(`${v} added`); }
        render();
      }
    });
  }

  function itemDialog(s){
    const subOpts = `<option value="">Whole ${esc(s.name.toLowerCase())}</option>` + s.subs.map(x => `<option value="${x.id}" ${x.id === activeSub ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
    const catOpts = Object.entries(CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    dialog({
      title: `Add item to ${esc(s.name)}`, ok: 'Add item',
      body: `<div class="field"><label for="itName">Item name<span class="req">*</span></label>
          <div class="ctl"><input id="itName" maxlength="60" placeholder="e.g. Dishwasher"></div><span class="msg" hidden>Enter a name.</span></div>
        <div class="field"><label for="itModel">Brand or model</label><div class="ctl"><input id="itModel" maxlength="60" placeholder="Optional"></div></div>
        <div class="field"><label for="itSub">Where in ${esc(s.name.toLowerCase())}</label><div class="ctl sel"><select id="itSub">${subOpts}</select></div></div>
        <div class="field"><label for="itCat">Type</label><div class="ctl sel"><select id="itCat">${catOpts}</select></div></div>`,
      onOk(bg){
        const v = bg.querySelector('#itName').value.trim(), f = bg.querySelector('.field');
        f.classList.toggle('err', !v); f.querySelector('.msg').hidden = !!v;
        if (!v) return false;
        store.addItem(s.id, {name:v, model:bg.querySelector('#itModel').value.trim(), sub:bg.querySelector('#itSub').value, cat:bg.querySelector('#itCat').value});
        toast(`${v} added`); render();
      }
    });
  }

  function wire(s){
    $('#editSpace').onclick = () => spaceDialog({space:s, onSaved: render});
    $('#delSpace').onclick = () => deleteSpaceDialog(s, () => { flashNext(`${s.name} deleted`); location.href = 'spaces.html'; });
    const hp = $('#heroPhoto');
    if (hp) hp.onclick = async () => { const f = await pickPhoto(); if (!f) return; try { store.updateSpace(s.id, {photo: await readPhoto(f)}); render(); toast('Cover photo added'); } catch(err){ toast(err.message); } };
    $('#addSub').onclick = () => subDialog(s);
    $('#addItem').onclick = () => itemDialog(s);
    $('#iq').addEventListener('input', e => { q = e.target.value; drawItems(); });
    const subs = $('#subs');
    if (subs) subs.addEventListener('click', async e => {
      const k = e.target.closest('[data-submenu]');
      if (k){
        e.stopPropagation();
        const x = s.subs.find(y => y.id === k.dataset.submenu);
        return menu(k, [
          {icon:'eye', label:'Show its items', run: () => { activeSub = x.id; render(); $('#h-items').scrollIntoView({behavior:'smooth', block:'start'}); }},
          {icon:'edit', label:'Rename', run: () => subDialog(s, x)},
          {icon:'upload', label: x.photo ? 'Replace photo' : 'Add photo', run: async () => { const f = await pickPhoto(); if (!f) return; try { store.updateSub(s.id, x.id, {photo: await readPhoto(f), pos:''}); render(); toast(`Photo added to ${x.name}`); } catch(err){ toast(err.message); } }},
          '-',
          {icon:'trash', label:'Delete subspace', danger:true, run: () => {
            const n = s.items.filter(i => i.sub === x.id).length;
            dialog({title:`Delete ${esc(x.name)}?`, ok:'Delete subspace', danger:true, size:'sm',
              body:`<p><b>${esc(x.name)}</b> will be removed from ${esc(s.name)}.${n ? ` Its ${plural(n, 'item')} stay in ${esc(s.name)}.` : ''}</p>`,
              onOk(){ store.deleteSub(s.id, x.id); if (activeSub === x.id) activeSub = ''; render(); toast(`${x.name} deleted`); }});
          }}
        ]);
      }
      const ph = e.target.closest('[data-subphoto]');
      if (ph){
        const f = await pickPhoto(); if (!f) return;
        try { store.updateSub(s.id, ph.dataset.subphoto, {photo: await readPhoto(f), pos:''}); render(); toast('Photo added'); } catch(err){ toast(err.message); }
        return;
      }
      const b = e.target.closest('[data-sub]');
      if (b){ activeSub = activeSub === b.dataset.sub ? '' : b.dataset.sub; render(); }
    });
    $('#items').addEventListener('click', e => {
      const k = e.target.closest('[data-itemmenu]'); if (!k) return;
      const it = s.items.find(i => i.id === k.dataset.itemmenu);
      menu(k, [
        {icon:'file', label:'View documents', run: () => toast(`${plural(it.docs || 0, 'document')} for ${it.name}`)},
        '-',
        {icon:'trash', label:'Delete item', danger:true, run: () => dialog({title:`Delete ${esc(it.name)}?`, ok:'Delete item', danger:true, size:'sm',
          body:`<p><b>${esc(it.name)}</b> will be removed from ${esc(s.name)}.${it.docs ? ` Its ${plural(it.docs, 'document')} stay in Documents.` : ''}</p>`,
          onOk(){ store.deleteItem(s.id, it.id); render(); toast(`${it.name} deleted`); }})}
      ]);
    });
  }

  $('#page').addEventListener('click', e => { if (e.target.closest('#clearSub')){ activeSub = ''; render(); } });
  window.addEventListener('hashchange', () => { id = decodeURIComponent(location.hash.slice(1)); activeSub = ''; q = ''; render(); scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>

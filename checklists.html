<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
/* Layout: list screen (Active / Completed / Templates tabs, card grid) and a detail screen per checklist or template. */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.toolbar .search{flex:0 1 340px;margin-left:auto}
.toolbar .seg button{height:34px;padding:0 16px;font-size:14px}
@media (max-width:640px){.toolbar .search{flex:1 1 100%}}

/* List view: each checklist / template is its own white card that expands in place */
.list{display:grid;gap:12px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:var(--line-2)}
.row.open{box-shadow:0 6px 18px rgba(20,32,46,.06)}
.row-h{display:flex;align-items:center;gap:6px;padding:0 12px 0 0}
.row-btn{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:16px 8px 16px 16px;text-align:left}
.row-btn:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.row-main{flex:1;min-width:0;display:grid;gap:4px}
.row-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-title b{font-size:15px;font-weight:600}
/* one icon scale: 16px actions/chevrons, 14px inline meta */
.row svg.i{width:16px;height:16px}
.row .ck-meta svg.i,.row .src svg.i,.row .badge svg.i{width:14px;height:14px}
.row .ck-meta{gap:4px 16px;align-items:center}
.row .ck-meta span,.row .src{display:inline-flex;align-items:center;gap:5px;line-height:1}
.ck-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--brand-tint);flex:none}
.row .ck-ico svg.i{width:16px;height:16px;color:var(--brand)}
.row-prog{flex:0 0 220px;display:flex;align-items:center}
.row-prog .pline{width:100%}
.row .chev{flex:none;color:var(--ink-3);transition:transform .2s}
.row.open .chev{transform:rotate(180deg)}
.row-h .ib{width:32px;height:32px;flex:none}
.badge.ok{background:var(--green-tint);color:var(--green)}
.badge.ok svg.i{color:var(--green)}
.row-body{border-top:1px solid var(--line);padding:4px 16px 4px 16px;animation:rowin .2s ease}
@keyframes rowin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.row-body .banner{margin:12px 0 4px}
.row-body .task{padding:11px 0}
.row-body .add-task{padding:10px 0 12px;border-top:1px solid var(--line)}
.row-body .task .ib{width:30px;height:30px}
.row.done .row-title b{color:var(--ink-2)}
.row.done .ck-ico{background:var(--green-tint)}
.row.done .ck-ico svg.i{color:var(--green)}
.row.tpl .ck-ico{background:#EEF7F1}
.row.tpl .ck-ico svg.i{color:#2F8F57}
.list>.empty-state{background:var(--surface);border:1px solid var(--line);border-radius:12px}
@media (max-width:760px){.row-prog{flex-basis:120px}}
@media (max-width:560px){.row-btn{flex-wrap:wrap;padding-left:14px}.row-prog{flex:1 1 100%;order:3}.row-body{padding-left:14px}.row-h .btn.sm{display:none}}

/* Checklist + template cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ck{position:relative;display:grid;gap:12px;text-align:left;padding:18px 18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s,transform .15s}
.ck:hover{border-color:var(--line-2);box-shadow:0 8px 22px rgba(20,32,46,.08);transform:translateY(-1px)}
.ck:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ck-top{display:flex;align-items:flex-start;gap:12px;padding-right:30px}
.ck-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--brand-tint);flex:none}
.ck-ico svg.i{color:var(--brand);width:20px;height:20px}
.ck.done .ck-ico{background:var(--green-tint)}
.ck.done .ck-ico svg.i{color:var(--green)}
.ck.tpl .ck-ico{background:#EEF7F1}
.ck.tpl .ck-ico svg.i{color:#2F8F57}
.ck h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.3}
.src{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:12.5px;color:var(--ink-3)}
.src svg.i{width:13px;height:13px}
.src.tpl{color:var(--brand);font-weight:500}
.src.tpl svg.i{color:var(--brand)}
.ck-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink-3)}
.ck-meta span{display:inline-flex;align-items:center;gap:5px}
.ck-meta svg.i{width:13px;height:13px}
.pline{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--brand);transition:width .3s}
.pline.full .pbar i{background:var(--green)}
.pfrac{font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:30px;text-align:right}
.pline.full .pfrac{color:var(--green)}
.next{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:9px 10px;border-radius:8px;background:var(--hover);min-width:0}
.next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next b{font-weight:600;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;flex:none}
.ready{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--green);padding:9px 10px;border-radius:8px;background:var(--green-tint)}
.ready svg.i{color:var(--green)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--seg-track);color:var(--ink-2)}
.ck>.kebab{position:absolute;top:14px;right:12px}
.ck:hover>.kebab{opacity:1}
.tpl-tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tpl-tasks li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.tpl-tasks li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-tasks li::before{content:"";width:12px;height:12px;border:1.5px solid var(--line-2);border-radius:3px;flex:none}
.tpl-tasks .more{color:var(--ink-3);font-size:12.5px}
.tpl-tasks .more::before{display:none}
.tpl-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px;border-top:1px solid var(--line)}
.tpl-foot small{font-size:12.5px;color:var(--ink-3)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}

/* New checklist dialog */
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:grid;gap:6px;text-align:left;padding:14px;border:1px solid var(--line-2);border-radius:10px}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);box-shadow:0 0 0 1px var(--brand) inset}
.choice .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.choice .ci svg.i{color:var(--brand);width:18px;height:18px}
.choice b{font-weight:600}
.choice span{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.tpl-pick{display:grid;gap:8px;max-height:240px;overflow:auto;padding:2px}
.tp{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px}
.tp:hover{border-color:var(--ink-3)}
.tp[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint)}
.tp b{display:block;font-weight:600}
.tp small{font-size:12.5px;color:var(--ink-3)}
.tp .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center}
.tp[aria-pressed="true"] .radio{border-color:var(--brand)}
.tp[aria-pressed="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.dlg textarea{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;line-height:1.5;resize:vertical}
.dlg textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
@media (max-width:560px){.choose{grid-template-columns:1fr}}

/* New / Edit checklist dialog */
.dlg.wide{width:min(600px,100%)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px;background:var(--seg-track);border-radius:12px}
.mode-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;text-align:left;color:var(--ink-2)}
.mode-opt:hover{color:var(--ink)}
.mode-opt[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,32,46,.12)}
.mode-opt .mi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.mode-opt[aria-checked="true"] .mi{background:var(--brand-tint);border-color:transparent}
.mode-opt .mi svg.i{width:16px;height:16px;color:var(--brand)}
.mode-opt b{display:block;font-weight:600;font-size:14px}
.mode-opt small{display:block;font-size:12px;color:var(--ink-3)}
.tpl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl-card{display:grid;gap:3px;text-align:left;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);transition:border-color .15s,background .15s}
.tpl-card:hover{border-color:var(--ink-3)}
.tpl-card[aria-checked="true"]{border-color:var(--brand);background:var(--brand-tint);box-shadow:0 0 0 1px var(--brand) inset}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tc-top b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-tick{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);flex:none}
.tc-tick svg.i{width:11px;height:11px;color:#fff;opacity:0}
.tpl-card[aria-checked="true"] .tc-tick{background:var(--brand);border-color:var(--brand)}
.tpl-card[aria-checked="true"] .tc-tick svg.i{opacity:1}
.tpl-card small{font-size:12px;color:var(--ink-3)}
.te{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.te:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.te-list{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}
.te-row{display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;border-bottom:1px solid var(--line)}
.te-n{width:20px;height:20px;border-radius:50%;background:var(--seg-track);color:var(--ink-3);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.te-in{flex:1;min-width:0;height:40px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;outline:none}
.te-x{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;opacity:.5}
.te-row:hover .te-x,.te-x:focus-visible{opacity:1}
.te-x:hover{background:var(--red-tint)}
.te-x:hover svg.i{color:var(--red)}
.te-x svg.i{width:14px;height:14px}
.te-add{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--hover)}
.te-add svg.i{width:16px;height:16px;color:var(--brand)}
.te-add input{flex:1;height:42px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;outline:none}
.te-empty{margin:0;padding:10px 12px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line)}
.te-count{font-weight:500;color:var(--ink-3)}
@media (max-width:560px){.mode,.tpl-grid{grid-template-columns:1fr}}

/* Detail screen */
.det-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.det-title{display:flex;align-items:center;gap:14px;min-width:0}
.det-title .back{border:1px solid var(--line-2);background:var(--surface);width:36px;height:36px;flex:none}
.det-title h1{margin:0;font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
.det-title .ck-meta{margin-top:6px}
.det-acts{display:flex;gap:8px;flex-wrap:wrap}
.progress-card{display:grid;gap:10px;padding:18px 20px;margin-bottom:16px}
.progress-card .big{display:flex;align-items:baseline;gap:8px}
.progress-card .big b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.progress-card .big span{color:var(--ink-3)}
.progress-card .pbar{height:10px;border-radius:5px}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;margin-bottom:16px;flex-wrap:wrap}
.banner.ok{background:var(--green-tint);color:var(--green)}
.banner.ok svg.i{color:var(--green);width:20px;height:20px}
.banner.info{background:var(--seg-track);color:var(--ink-2)}
.banner b{font-weight:600}
.banner .grow{flex:1;min-width:180px}
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task:hover{background:var(--hover)}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.6px solid var(--line-2);border-radius:6px;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--surface);transition:background .15s,border-color .15s}
.task input[type=checkbox]:hover{border-color:var(--brand)}
.task input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
.task input[type=checkbox]:checked::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task input[type=checkbox]:disabled{cursor:default;opacity:.8}
.task .tt{flex:1;min-width:0}
.task .tt span{display:block;font-size:14.5px}
.task.is-done .tt span{color:var(--ink-3);text-decoration:line-through}
.task .tt small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.task .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.task:hover .acts,.task:focus-within .acts{opacity:1}
@media (hover:none){.task .acts{opacity:1}}
.task .edit-in{flex:1;height:34px;padding:0 10px;border:1px solid var(--brand);border-radius:7px;box-shadow:0 0 0 3px var(--brand-tint);outline:none;background:var(--surface);color:var(--ink);font:inherit}
.ib.del:hover{background:var(--red-tint)}
.ib.del:hover svg.i{color:var(--red)}
.add-task{display:flex;align-items:center;gap:10px;padding:10px 20px 14px;border-top:1px solid var(--line)}
.add-task svg.i{color:var(--brand)}
.add-task input{flex:1;height:38px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14.5px;outline:none}
.add-task input::placeholder{color:var(--ink-3)}
.pop-in{animation:popin .35s ease}
@keyframes popin{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (max-width:640px){.task,.add-task{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="home-dashboard.html"><img src="assets/logo-mark.png" alt="" width="150" height="130"><span>Home Record Keeper</span></a>
    <nav class="nav" aria-label="Main">
      <a href="home-dashboard.html">Overview</a>
      <a href="spaces.html">Spaces</a>
      <a href="items.html">Items</a>
      <a href="documents.html">Documents</a>
      <a href="checklists.html" aria-current="page">Checklists<span class="nav-n">4</span></a>
      <a href="activity.html">Activity</a>
      <a href="access.html">Property access</a>
    </nav>
    <div class="top-r">
      <button class="bell" aria-label="Notifications (12 unread)"><svg class="i"><use href="#i-bell"/></svg><i></i></button>
      <span class="av" role="img" aria-label="Brady Ricci"></span>
    </div>
  </div>
</header>

<main class="page" id="page"></main>

<script src="assets/hrk.js"></script>
<script>
(function(){
  const {checklists: C, ico, esc, plural, dialog, menu, toast} = HRK;
  const $ = s => document.querySelector(s);
  const TABS = {active:'Active', completed:'Completed', templates:'Templates'};
  let tab = 'active', q = '', editing = '';
  const open = new Set();   /* ids of rows that are expanded */

  /* Hash: #active, #completed, #templates; #c-<id> or #t-<id> opens that row in its tab */
  function readHash(){
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('c-')){ const c = C.get(h.slice(2)); if (c){ tab = c.status === 'completed' ? 'completed' : 'active'; open.add(c.id); } return c && c.id; }
    if (h.startsWith('t-')){ tab = 'templates'; open.add(h.slice(2)); return h.slice(2); }
    if (TABS[h]) tab = h;
    return null;
  }
  const syncNav = () => document.querySelectorAll('.nav .nav-n').forEach(n => n.textContent = C.active().length);
  const progressLine = c => { const {done, total} = C.progress(c); return `<span class="pline${total && done === total ? ' full' : ''}"><span class="pbar"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></span><span class="pfrac">${done}/${total}</span></span>`; };
  const srcChip = c => c.template && C.template(c.template) ? `<span class="src tpl">${esc(C.source(c))}</span>` : `<span class="src">Custom</span>`;

  /* ---------- Screen ---------- */
  function render(){
    syncNav();
    document.title = 'Checklists';
    const act = C.active(), comp = C.completed(), tps = C.templates();
    const counts = {active:act.length, completed:comp.length, templates:tps.length};
    $('#page').innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="home-dashboard.html">Vail Residence</a>${ico('right')}<span aria-current="page">Checklists</span></nav>
      <div class="page-h">
        <div><h1>Checklists</h1><p>${plural(act.length, 'active checklist')} · ${comp.length} completed · ${plural(tps.length, 'template')}</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" type="button" id="newTpl">${ico('template')}New template</button>
          <button class="btn primary" type="button" id="newCl">${ico('plus')}New checklist</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="seg" role="tablist" id="tabs" aria-label="Checklists">
          ${Object.entries(TABS).map(([k, v]) => `<button role="tab" type="button" id="tab-${k}" data-t="${k}" aria-selected="${k === tab}">${v}<span class="n">${counts[k]}</span></button>`).join('')}
        </div>
        <label class="search">${ico('search')}<input id="q" type="search" placeholder="Search ${tab === 'templates' ? 'templates' : 'checklists or tasks'}" aria-label="Search" value="${esc(q)}"></label>
      </div>
      <section class="list" id="list" role="tabpanel" aria-labelledby="tab-${tab}"></section>`;
    drawRows();
    $('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b || b.dataset.t === tab) return; tab = b.dataset.t; q = ''; editing = ''; history.replaceState(null, '', '#' + tab); render(); $('#tab-' + tab).focus(); };
    $('#q').addEventListener('input', e => { q = e.target.value; drawRows(); });
    $('#newCl').onclick = () => newChecklistDialog();
    $('#newTpl').onclick = () => templateDialog();
  }

  function drawRows(){
    const ql = q.trim().toLowerCase();
    const hit = (name, tasks, extra = '') => !ql || name.toLowerCase().includes(ql) || extra.toLowerCase().includes(ql) || tasks.some(t => (t.text || t).toLowerCase().includes(ql));
    let html;
    if (tab === 'templates'){
      const list = C.templates().filter(t => hit(t.name, t.tasks, t.cadence || ''));
      html = list.map(tplRow).join('') || empty(ql ? 'No templates match' : 'No templates yet', ql ? 'Try another name or task.' : 'Save a checklist as a template, or create one with New template.');
    } else {
      const list = (tab === 'active' ? C.active() : C.completed()).filter(c => hit(c.name, c.tasks, C.source(c)));
      html = list.map(clRow).join('') || empty(ql ? 'No checklists match' : tab === 'active' ? 'Nothing on your list' : 'No completed checklists yet',
        ql ? 'Try another name or task.' : tab === 'active' ? 'Start one from a template or from scratch with New checklist.' : 'Finished checklists will appear here.');
    }
    $('#list').innerHTML = html;
  }
  const empty = (b, s) => `<div class="empty-state"><b>${b}</b>${s}</div>`;

  /* One checklist row: header (click to expand) and its tasks */
  function clRow(c){
    const {done, total} = C.progress(c), isDone = c.status === 'completed', all = total && done === total, isOpen = open.has(c.id);
    return `<div class="row${isOpen ? ' open' : ''}${isDone ? ' done' : ''}" id="row-${c.id}">
      <div class="row-h">
        <button type="button" class="row-btn" data-toggle="${c.id}" aria-expanded="${isOpen}" aria-controls="body-${c.id}">
          <span class="row-main">
            <span class="row-title"><b>${esc(c.name)}</b></span>
            <span class="ck-meta">${srcChip(c)}<span>${ico('cal')}${isDone ? 'Completed ' + C.fmtDate(c.completed) : C.fmtDate(c.created)}</span><span>${plural(total, 'task')}</span></span>
          </span>
          <span class="row-prog">${progressLine(c)}</span>
          <svg class="i chev" aria-hidden="true"><use href="#i-down"/></svg>
        </button>
        <button type="button" class="ib" data-cmenu="${c.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${esc(c.name)}">${ico('more')}</button>
      </div>
      ${isOpen ? `<div class="row-body" id="body-${c.id}">
        <ul class="tasks">${c.tasks.map(t => taskRow(c, t, isDone)).join('') || `<li class="empty-state" style="padding:18px"><b>No tasks yet</b></li>`}</ul>
      </div>` : ''}
    </div>`;
  }
  function taskRow(c, t, locked){
    return `<li class="task${t.done ? ' is-done' : ''}">
      <input type="checkbox" id="k-${t.id}" data-tick="${c.id}|${t.id}" ${t.done ? 'checked' : ''} ${locked ? 'disabled' : ''}>
      <label class="tt" for="k-${t.id}"><span>${esc(t.text)}</span>${t.done ? `<small>${C.checkedLabel(t.doneAt)}</small>` : ''}</label>
    </li>`;
  }

  /* One template row */
  function tplRow(t){
    const used = C.usage(t.id), isOpen = open.has(t.id);
    return `<div class="row tpl${isOpen ? ' open' : ''}" id="row-${t.id}">
      <div class="row-h">
        <button type="button" class="row-btn" data-toggle="${t.id}" aria-expanded="${isOpen}" aria-controls="body-${t.id}">
          <span class="row-main">
            <span class="row-title"><b>${esc(t.name)}</b></span>
            <span class="ck-meta"><span>${plural(t.tasks.length, 'task')}</span><span>${used ? `Used by ${plural(used, 'checklist')}` : 'Not used yet'}</span></span>
          </span>
          <svg class="i chev" aria-hidden="true"><use href="#i-down"/></svg>
        </button>
        <button type="button" class="btn primary sm" data-use="${t.id}">${ico('plus')}Use template</button>
        <button type="button" class="ib" data-tmenu="${t.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${esc(t.name)}">${ico('more')}</button>
      </div>
      ${isOpen ? `<div class="row-body" id="body-${t.id}">
        <ul class="tasks">${t.tasks.map(x => `<li class="task"><input type="checkbox" disabled aria-hidden="true"><span class="tt"><span>${esc(x)}</span></span></li>`).join('') || `<li class="empty-state" style="padding:18px"><b>No tasks yet</b>Use Edit template to add some.</li>`}</ul>
      </div>` : ''}
    </div>`;
  }

  /* ---------- Row interactions (delegated) ---------- */
  document.addEventListener('click', e => {
    if (!$('#list') || !$('#list').contains(e.target)) return;
    const tg = e.target.closest('[data-toggle]');
    if (tg){ const id = tg.dataset.toggle; open.has(id) ? open.delete(id) : open.add(id); editing = ''; drawRows(); return; }
    const use = e.target.closest('[data-use]'); if (use) return newChecklistDialog(use.dataset.use);
    const cm = e.target.closest('[data-cmenu]'); if (cm) return clMenu(cm, C.get(cm.dataset.cmenu));
    const tm = e.target.closest('[data-tmenu]'); if (tm) return tplMenu(tm, C.template(tm.dataset.tmenu));
    const co = e.target.closest('[data-complete]');
    if (co){ const c = C.get(co.dataset.complete); C.complete(c.id); toast(`${c.name} completed. Find it under Completed.`); render(); return; }
  });
  document.addEventListener('change', e => {
    const tk = e.target.dataset && e.target.dataset.tick; if (!tk) return;
    const [cid, tid] = tk.split('|');
    const finished = C.toggle(cid, tid, e.target.checked);
    if (finished){ open.delete(cid); toast(`${C.get(cid).name} is complete. Moved to Completed.`); render(); return; }
    syncNav(); drawRows();
    if (e.target.checked){ const box = $('#k-' + tid); box && box.classList.add('pop-in'); }
  });

  /* ---------- Menus ---------- */
  function clMenu(btn, c){
    const items = [
      {icon:'edit', label:'Edit', run: () => editDialog(c)}
    ];
    items.push('-', {icon:'trash', label:'Delete checklist', danger:true, run: () => deleteChecklist(c)});
    menu(btn, items);
  }
  function tplMenu(btn, t){
    menu(btn, [
      {icon:'edit', label:'Edit template', run: () => templateDialog(t)},
      '-',
      {icon:'trash', label:'Delete template', danger:true, run: () => {
        const used = C.usage(t.id);
        dialog({title:`Delete ${esc(t.name)}?`, ok:'Delete template', danger:true, size:'sm',
          body:`<p>The <b>${esc(t.name)}</b> template will be removed.${used ? ` ${plural(used, 'checklist')} made from it stay, and will show as Custom.` : ''}</p>`,
          onOk(){ C.removeTemplate(t.id); toast(`${t.name} deleted`); render(); }});
      }}
    ]);
  }

  /* ---------- Dialogs ---------- */
  /* Editable task list used by the New and Edit dialogs.
     items: [{id?, text}] — returns () => [{id?, text}] in the current order */
  function taskEditor(root, items){
    let list = items.map(x => ({...x}));
    const draw = () => {
      root.innerHTML = `
        <ol class="te-list">${list.map((x, i) => `<li class="te-row">
          <span class="te-n">${i + 1}</span>
          <input class="te-in" data-i="${i}" value="${esc(x.text)}" maxlength="120" aria-label="Task ${i + 1}">
          <button type="button" class="te-x" data-rm="${i}" aria-label="Remove task ${i + 1}">${ico('x')}</button>
        </li>`).join('')}</ol>
        <div class="te-add">${ico('plus')}<input id="teNew" placeholder="Add a task and press Enter" maxlength="120" aria-label="Add a task"></div>
        <p class="te-empty"${list.length ? ' hidden' : ''}>No tasks yet. You can add them now or later.</p>`;
    };
    draw();
    root.addEventListener('input', e => { const i = e.target.dataset.i; if (i !== undefined) list[i].text = e.target.value; });
    root.addEventListener('click', e => { const x = e.target.closest('[data-rm]'); if (!x) return; e.stopPropagation(); list.splice(+x.dataset.rm, 1); draw(); root.querySelector('#teNew').focus(); });
    root.addEventListener('keydown', e => {
      if (e.target.id !== 'teNew' || e.key !== 'Enter') return;
      e.preventDefault(); const v = e.target.value.trim(); if (!v) return;
      list.push({text:v}); draw(); root.querySelector('#teNew').focus();
    });
    return {
      get: () => { const pending = root.querySelector('#teNew').value.trim(); return [...list, ...(pending ? [{text:pending}] : [])].map(x => ({...x, text:x.text.trim()})).filter(x => x.text); },
      set: next => { list = next.map(x => ({...x})); draw(); }
    };
  }

  function newChecklistDialog(preTpl){
    const tps = C.templates();
    let mode = preTpl ? 'tpl' : (tps.length ? 'tpl' : 'blank'), pick = preTpl || (tps[0] || {}).id, editor, nameTouched = false;
    dialog({
      title: 'New checklist', ok: 'Create checklist', size: 'wide',
      body: `
        <div class="mode" id="mode" role="radiogroup" aria-label="How to start">
          <button type="button" class="mode-opt" data-m="tpl" role="radio" aria-checked="${mode === 'tpl'}"><span class="mi">${ico('repeat')}</span><span><b>From a template</b><small>Reuse a saved list</small></span></button>
          <button type="button" class="mode-opt" data-m="blank" role="radio" aria-checked="${mode === 'blank'}"><span class="mi">${ico('edit')}</span><span><b>Blank checklist</b><small>Start from scratch</small></span></button>
        </div>
        <div class="field" id="tplField"><span class="lab">Choose a template</span><div class="tpl-grid" id="tplPick" role="radiogroup" aria-label="Templates"></div></div>
        <div class="field"><label for="clName">Checklist name<span class="req">*</span></label><div class="ctl"><input id="clName" maxlength="60" placeholder="e.g. October routine"></div><span class="msg" hidden>Give the checklist a name.</span></div>
        <div class="field"><span class="lab">Tasks <span class="te-count" id="teCount"></span></span><div class="te" id="te"></div></div>`,
      onOpen(bg){
        editor = taskEditor(bg.querySelector('#te'), []);
        const count = () => { const n = editor.get().length; bg.querySelector('#teCount').textContent = n ? '· ' + plural(n, 'task') : ''; };
        const sync = (resetTasks) => {
          bg.querySelectorAll('#mode .mode-opt').forEach(o => o.setAttribute('aria-checked', o.dataset.m === mode));
          bg.querySelector('#tplField').hidden = mode !== 'tpl';
          bg.querySelector('#tplPick').innerHTML = tps.map(t => `<button type="button" class="tpl-card" data-tp="${t.id}" role="radio" aria-checked="${t.id === pick}">
            <span class="tc-top"><b>${esc(t.name)}</b><span class="tc-tick">${ico('check')}</span></span>
            <small>${t.cadence ? esc(t.cadence) + ' · ' : ''}${plural(t.tasks.length, 'task')}</small></button>`).join('') || '<span class="help">No templates yet.</span>';
          const tp = C.template(pick), name = bg.querySelector('#clName');
          if (resetTasks){
            if (mode === 'tpl' && tp){ if (!nameTouched) name.value = tp.name; editor.set(tp.tasks.map(text => ({text}))); }
            else { if (!nameTouched) name.value = ''; editor.set([]); }
          }
          
          count();
        };
        bg.querySelector('#mode').onclick = e => { const o = e.target.closest('[data-m]'); if (!o || o.dataset.m === mode) return; mode = o.dataset.m; sync(true); };
        bg.querySelector('#tplPick').onclick = e => { const o = e.target.closest('[data-tp]'); if (!o || o.dataset.tp === pick) return; pick = o.dataset.tp; sync(true); };
        bg.querySelector('#clName').addEventListener('input', () => { nameTouched = true; });
        bg.querySelector('#te').addEventListener('click', () => setTimeout(count));
        bg.querySelector('#te').addEventListener('keyup', count);
        sync(true);
      },
      onOk(bg){
        const name = bg.querySelector('#clName').value.trim(), f = bg.querySelector('#clName').closest('.field');
        f.classList.toggle('err', !name); f.querySelector('.msg').hidden = !!name;
        if (!name){ bg.querySelector('#clName').focus(); return false; }
        const c = C.create({name, template: mode === 'tpl' ? pick : null, tasks: editor.get().map(x => x.text)});
        tab = 'active'; q = ''; open.add(c.id); history.replaceState(null, '', '#active');
        toast(`${name} created`); render();
        const row = $('#row-' + c.id); row && row.scrollIntoView({behavior:'smooth', block:'center'});
      }
    });
  }
  /* Edit a checklist: name and tasks. Kept tasks keep their ticks. */
  function editDialog(c){
    let editor;
    dialog({title:'Edit checklist', ok:'Save changes', size:'wide',
      body:`<div class="field"><label for="rn">Checklist name<span class="req">*</span></label><div class="ctl"><input id="rn" maxlength="60" value="${esc(c.name)}"></div><span class="msg" hidden>Enter a name.</span></div>
        <div class="field"><span class="lab">Tasks</span><div class="te" id="te"></div><span class="help">Ticked tasks stay ticked. New tasks are added unticked.</span></div>`,
      onOpen(bg){ editor = taskEditor(bg.querySelector('#te'), c.tasks.map(t => ({id:t.id, text:t.text}))); },
      onOk(bg){
        const v = bg.querySelector('#rn').value.trim(), f = bg.querySelector('#rn').closest('.field');
        f.classList.toggle('err', !v); f.querySelector('.msg').hidden = !!v; if (!v) return false;
        const byId = Object.fromEntries(c.tasks.map(t => [t.id, t]));
        const tasks = editor.get().map(x => x.id && byId[x.id] ? {...byId[x.id], text:x.text}
          : {id:'t' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text:x.text, done:false, doneAt:null});
        C.update(c.id, {name:v, tasks});
        toast('Checklist updated'); render();
      }});
  }
  function deleteChecklist(c){
    const {done, total} = C.progress(c);
    dialog({title:`Delete ${esc(c.name)}?`, ok:'Delete checklist', danger:true, size:'sm',
      body:`<p><b>${esc(c.name)}</b> and its ${plural(total, 'task')}${done ? ` (${done} done)` : ''} will be permanently removed.</p>`,
      onOk(){ C.remove(c.id); open.delete(c.id); toast(`${c.name} deleted`); render(); }});
  }
  function templateDialog(t){
    dialog({title: t ? `Edit ${esc(t.name)}` : 'New template', ok: t ? 'Save template' : 'Create template',
      body:`<div class="field"><label for="tn">Template name<span class="req">*</span></label><div class="ctl"><input id="tn" maxlength="60" value="${t ? esc(t.name) : ''}" placeholder="e.g. Monthly routine"></div><span class="msg" hidden>Enter a name.</span></div>
        <div class="field"><label for="tt">Tasks</label><textarea id="tt" placeholder="One task per line">${t ? esc(t.tasks.join('\n')) : ''}</textarea><span class="help">One task per line. Checklists already made from this template don't change.</span></div>`,
      onOk(bg){ const v = bg.querySelector('#tn').value.trim(), f = bg.querySelector('#tn').closest('.field'); f.classList.toggle('err', !v); f.querySelector('.msg').hidden = !!v; if (!v) return false;
        const data = {name:v, cadence: t ? t.cadence || '' : '', tasks:bg.querySelector('#tt').value.split('\n').map(s => s.trim()).filter(Boolean)};
        if (t){ C.updateTemplate(t.id, data); toast('Template saved'); }
        else { const tp = C.addTemplate(data); tab = 'templates'; open.add(tp.id); history.replaceState(null, '', '#templates'); toast(`${v} created`); }
        render(); }});
  }

  addEventListener('hashchange', () => { readHash(); editing = ''; render(); });
  const focusId = readHash();
  if (!focusId && tab === 'active'){ const first = C.active()[0]; if (first) open.add(first.id); }
  render();
  if (focusId){ const row = $('#row-' + focusId); row && row.scrollIntoView({block:'center'}); history.replaceState(null, '', '#' + tab); }
})();
</script>
</body>
</html>
